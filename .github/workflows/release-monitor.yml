# The node release monitor (propose-bump shape) — the ruby factory's
# daily monitor is the precedent, minus the patch tree (node is a
# repacked runtime: no patches, no source roll — a bump is version +
# digests). Daily: tools/monitor checks nodejs.org for a newer release
# on the pinned major line and, when one exists, rewrites Tebakofile's
# flavor sources (official dists + the unofficial-builds musl legs,
# digests from both SHASUMS256.txt files); this workflow turns the
# dirty tree into a PR. Never crosses major lines (the line pin is an
# owner decision); never merges (the bump PR rides the lint gate and
# merges like every other PR).
name: release-monitor

on:
  schedule:
    # Off the :00/:30 herd; distinct from tamatebako/ruby's 17 6.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: propose the next node pin
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.monitor.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: check upstream + rewrite the pin
        id: monitor
        run: |
          set -euo pipefail
          ruby tools/monitor | tee monitor-result.json
          {
            echo "verdict<<VERDICT_JSON_EOF"
            cat monitor-result.json
            echo "VERDICT_JSON_EOF"
          } >> "$GITHUB_OUTPUT"
          cat monitor-result.json >> "$GITHUB_STEP_SUMMARY"

      # create-pull-request is a no-op on a clean tree — the "current"
      # verdict commits nothing and this step simply succeeds. The
      # add-paths guard keeps the commit to the recipe alone: never the
      # runner's .bundle config (bundler-cache writes one), never the
      # run's monitor-result.json.
      - name: open the bump pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: monitor/node-pin
          add-paths: Tebakofile
          title: "node ${{ fromJSON(steps.monitor.outputs.verdict).candidate }} (release monitor)"
          commit-message: "node ${{ fromJSON(steps.monitor.outputs.verdict).candidate }} (release monitor)"
          body: |
            Automated pin bump by the release monitor: node **${{ fromJSON(steps.monitor.outputs.verdict).candidate }}** is the newest release on the pinned line (was ${{ fromJSON(steps.monitor.outputs.verdict).current }}).

            - all flavor sources moved: the official dists, the unofficial-builds musl legs, the windows zip
            - digests re-pinned from both upstream SHASUMS256.txt files
            - no major-line crossing; no other `version:` key touched (the tools pins stay)

            Merging runs the lint gate; the publish rides the factory's own release cadence (build-payload's dispatch).
